services:
  postgres:
    image: postgres:16-alpine
    container_name: fohoway-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fohoway
      POSTGRES_PASSWORD: fohoway
      POSTGRES_DB: fohoway
    ports:
      - "5433:5432"
    volumes:
      - fohoway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fohoway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fohoway_pgdata:
